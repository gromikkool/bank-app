spring:
  application:
    name: bank-app
  security:
    oauth2:
      client:
        registration:
          keycloak:
            provider: keycloak
            client-id: ${KEYCLOAK_CLIENT_ID}
            client-secret: ${KEYCLOAK_CLIENT_SECRET}
            client-name: ${KEYCLOAK_CLIENT_NAME}
            authorization-grant-type: authorization_code
            scope:
              - openid
              - profile
              - email
      resourceserver:
        jwt:
          issuer-uri: ${JWT_RESOURCE_SERVER_URL}
server:
  port: ${BANK_APP_PORT}

feign:
  person-service-url: ${FEIGN_PERSON_SERVICE_URL:http://person-service:8080/}
  transaction-service-url: ${FEIGN_TRANSACTION_SERVICE_URL:http://transaction-service:8080/}

keycloak:
  auth-server-url: ${KEYCLOAK_AUTH_SERVER_URL}
  realm: ${KEYCLOAK_REALM}
  realm-admin-user: ${KEYCLOAK_REALM_ADMIN_USER}
  realm-admin-password: ${KEYCLOAK_REALM_ADMIN_PASSWORD}

management:
  tracing:
    sampling:
      probability: 1.0
  otlp:
    tracing:
      endpoint: http://jaeger:4318/v1/traces