plugins {
    id("java")
    id 'org.openapi.generator' version "$openApiGeneratorVersion"
    id 'maven-publish'
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

group = "com.k3sh"
version = "1.0.0-SNAPSHOT"

openApiGenerate {
    generatorName = "spring"
    inputSpec = "$rootDir/openapi/openapi.yaml"
    outputDir = "$buildDir/generated"
    modelPackage = "com.k3sh.common.model"
    apiPackage = "com.k3sh.common.api"
    generateApiDocumentation = false
    skipOperationExample = true
    generateModelTests = false
    generateModelDocumentation = false
    configOptions = [
            "library"             : "spring-boot",
            "interfaceOnly"       : "true",
            "useSpringBoot3"      : "true",
            "openApiNullable"     : "false",
            "skipDefaultInterface": "true",
            "skipDefaultExample"  : "true",
    ]
}

sourceSets.main.java.srcDir "$buildDir/generated/src/main/java"

compileJava.dependsOn tasks.openApiGenerate


publishing {
    publications {
        mavenJava(MavenPublication) {
            groupId = group
            artifactId = 'person-service-client'
            version = version

            from components.java
        }
    }

    repositories {
        maven {
            name = "ExternalRepo"
            // Use the property 'repoUrl' if provided, otherwise default to local Nexus
            url = project.hasProperty('repoUrl') ? project.property('repoUrl') : 'http://localhost:8081/repository/maven-releases/'

            credentials {
                username = project.hasProperty('gprUser') ? project.property('gprUser') : 'admin'
                password = project.hasProperty('gprKey') ? project.property('gprKey') : '3717grom'
            }

            allowInsecureProtocol = true
        }
    }
}

repositories {
    mavenCentral()
}

dependencies {
    compileOnly "javax.annotation:javax.annotation-api:${javaxAnnotationApiVersion}"
    compileOnly "org.springframework:spring-core:${springCoreVersion}"
    compileOnly "jakarta.validation:jakarta.validation-api:${jakartaValidationApiVersion}"
    compileOnly "org.openapitools:jackson-databind-nullable:${jacksonDatabindNullableVersion}"
    compileOnly "io.swagger.core.v3:swagger-annotations:${swaggerAnnotationsVersion}"
    compileOnly "com.fasterxml.jackson.core:jackson-databind:${jacksonDatabindVersion}"
    compileOnly "jakarta.annotation:jakarta.annotation-api:${jakartaAnnotationApiVersion}"
    compileOnly 'org.springframework:spring-context:7.0.0-M6'
    implementation 'org.springframework:spring-web:7.0.0-M6'
    compileOnly 'jakarta.servlet:jakarta.servlet-api:6.1.0'
}
