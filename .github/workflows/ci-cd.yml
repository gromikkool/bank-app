name: BankApp monorepo
on:
  push:
    branches:
      - develop
  pull_request:
    branches:
      - develop
env:
  GPR_REPO_URL: "https://maven.pkg.github.com/gromikkool/bank-app"

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      packages: write
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Make all gradlew scripts executable
        run: find . -name "gradlew" -exec chmod +x {} +

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: 21
          distribution: 'corretto'
          cache: 'gradle'

      # Step 1: Publish Service B (The dependency)

      - name: Publish person-service-client
        run: cd person-service/person-service-client && ./gradlew publish -PrepoUrl=${{ env.GPR_REPO_URL }} -PgprUser=${{ secrets.GPR_USER }} -PgprKey=${{ secrets.GITHUB_TOKEN }}

      - name: Publish transaction-service-client
        run: cd transaction-service/transaction-service-client && ./gradlew publish -PrepoUrl=${{ env.GPR_REPO_URL }} -PgprUser=${{ secrets.GPR_USER }} -PgprKey=${{ secrets.GITHUB_TOKEN }}

      - name: Build service individuals-API
        run: cd individuals-api && ./gradlew build -x test -PrepoUrl=${{ env.GPR_REPO_URL }} -PgprUser=${{ secrets.GPR_USER }} -PgprKey=${{ secrets.GITHUB_TOKEN }}

      - name: Build service transaction-service
        run: cd transaction-service && ./gradlew build -x test -PrepoUrl=${{ env.GPR_REPO_URL }} -PgprUser=${{ secrets.GPR_USER }} -PgprKey=${{ secrets.GITHUB_TOKEN }}

      - name: Build service person-service
        run: cd person-service && ./gradlew build -x test -PrepoUrl=${{ env.GPR_REPO_URL }} -PgprUser=${{ secrets.GPR_USER }} -PgprKey=${{ secrets.GITHUB_TOKEN }}


#      # Step 2: Run integration tests
#      - name: Run integration tests
#        run: cd individuals-api && ./gradlew test -PrepoUrl=${{ env.GPR_REPO_URL }} -PgprUser=${{ secrets.GPR_USER }} -PgprKey=${{ secrets.GITHUB_TOKEN }}

  docker-create:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      packages: write
      contents: read
    strategy:
      matrix:
        service: [ individuals-api, transaction-service, person-service ]

    steps:
      - uses: actions/checkout@v4
      - name: Log in to GitHub Container Registry
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Build and push docker image
        run: |
          IMAGE_ID=ghcr.io/${{ github.repository_owner }}/${{ matrix.service }}
          
          docker build -t $IMAGE_ID:latest ./${{ matrix.service }}
          docker push $IMAGE_ID:latest