name: BankApp monorepo
on:
  push:
    branches: [ develop ]
  pull_request:
    branches: [ develop ]
  workflow_dispatch:
    inputs:
      force_all:
        description: 'Force build all services'
        type: boolean
        default: false

env:
  GPR_REPO_URL: "https://maven.pkg.github.com/gromikkool/bank-app"

jobs:
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      individuals-api: ${{ steps.filter.outputs.individuals-api}}
      person-service: ${{ steps.filter.outputs.person-service }}
      transaction-service: ${{ steps.filter.outputs.transaction-service }}
      docker-matrix: ${{ steps.set-matrix.outputs.matrix }}
      any-changed: ${{ steps.set-matrix.outputs.any-changed }}
    steps:
      - uses: actions/checkout@v4

      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            individuals-api:
              - 'individuals-api/**'
            person-service:
              - 'person-service/**'
            transaction-service:
              - 'transaction-service/**'

      - name: Build docker matrix from changed services
        id: set-matrix
        run: |
          SERVICES=()
          if [ "${{ steps.filter.outputs.individuals-api }}" == "true" ]; then
            SERVICES+=('{"service":"individuals-api"}')
          fi
          if [ "${{ steps.filter.outputs.person-service }}" == "true" ]; then
            SERVICES+=('{"service":"person-service"}')
          fi
          if [ "${{ steps.filter.outputs.transaction-service }}" == "true" ]; then
            SERVICES+=('{"service":"transaction-service"}')
          fi

          if [ ${#SERVICES[@]} -eq 0 ]; then
            echo "matrix={\"include\":[]}" >> $GITHUB_OUTPUT
            echo "any-changed=false" >> $GITHUB_OUTPUT
          else
            JSON=$(printf ',%s' "${SERVICES[@]}")
            JSON="[${JSON:1}]"
            echo "matrix={\"include\":$JSON}" >> $GITHUB_OUTPUT
            echo "any-changed=true" >> $GITHUB_OUTPUT
          fi

  build:
    needs: detect-changes
    runs-on: ubuntu-latest
    permissions:
      packages: write
      contents: read
    if: needs.detect-changes.outputs.any-changed == 'true'
    steps:
      - uses: actions/checkout@v4

      - name: Make all gradlew scripts executable
        run: find . -name "gradlew" -exec chmod +x {} +

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: 21
          distribution: 'corretto'
          cache: 'gradle'

      - name: Publish Person-service client
        if: needs.detect-changes.outputs.person-service == 'true'
        run: |
          cd person-service/person-service-client && ./gradlew publish \
          -PrepoUrl=${{ env.GPR_REPO_URL }} \
          -PgprUser=${{ secrets.GPR_USER }} \
          -PgprKey=${{ secrets.GITHUB_TOKEN }}

      - name: Publish Transaction-Service client
        if: needs.detect-changes.outputs.transaction-service == 'true'
        run: |
          cd transaction-service/transaction-service-client && ./gradlew publish \
          -PrepoUrl=${{ env.GPR_REPO_URL }} \
          -PgprUser=${{ secrets.GPR_USER }} \
          -PgprKey=${{ secrets.GITHUB_TOKEN }}



      - name: Build individuals-api
        if: needs.detect-changes.outputs.individuals-api == 'true'
        run: |
          cd individuals-api && ./gradlew build -x test \
          -PrepoUrl=${{ env.GPR_REPO_URL }} \
          -PgprUser=${{ secrets.GPR_USER }} \
          -PgprKey=${{ secrets.GITHUB_TOKEN }}

      - name: Build transaction-service
        if: needs.detect-changes.outputs.transaction-service == 'true'
        run: |
          cd transaction-service && ./gradlew build -x test \
            -PrepoUrl=${{ env.GPR_REPO_URL }} \
            -PgprUser=${{ secrets.GPR_USER }} \
            -PgprKey=${{ secrets.GITHUB_TOKEN }}

      - name: Build person-service
        if: needs.detect-changes.outputs.person-service == 'true'
        run: |
          cd person-service && ./gradlew build -x test \
            -PrepoUrl=${{ env.GPR_REPO_URL }} \
            -PgprUser=${{ secrets.GPR_USER }} \
            -PgprKey=${{ secrets.GITHUB_TOKEN }}

      - name: Upload JARs
        uses: actions/upload-artifact@v4
        with:
          name: compiled-jars
          path: |
            **/build/libs/*.jar
          retention-days: 1

  docker-create:
    needs: [ detect-changes, build ]
    if: needs.detect-changes.outputs.any-changed == 'true'
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      packages: write
      contents: read
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.detect-changes.outputs.docker-matrix) }}
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Generate docker image tag
        run: echo "IMAGE_TAG=$GITHUB_SHA-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" >> $GITHUB_ENV

      - name: Set Image Context
        run: |
           echo "IMAGE_BASE=ghcr.io/${{ github.repository_owner }}/${{ matrix.service }}" >> $GITHUB_ENV
           echo "IMAGE_BASE_ECR=${{ steps.login-ecr.outputs.registry }}/bank-app/${{ matrix.service }}" >> $GITHUB_ENV

      - name: Download JARs
        uses: actions/download-artifact@v4
        with:
          name: compiled-jars

      - name: Build docker image
        run: |
          docker build \
            -t ${{ env.IMAGE_BASE }}:latest \
            -t ${{ env.IMAGE_BASE }}:${{ env.IMAGE_TAG }} \
            -t ${{ env.IMAGE_BASE_ECR }}:latest \
            -t ${{ env.IMAGE_BASE_ECR }}:${{ env.IMAGE_TAG }} \
            ./${{ matrix.service }}

      - name: Run trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.IMAGE_BASE }}:${{ env.IMAGE_TAG }}
          format: 'table'
          exit-code: 1
          ignore-unfixed: true
          severity: CRITICAL

      - name: Push docker images
        run: |
          docker push ${{ env.IMAGE_BASE }}:latest
          docker push ${{ env.IMAGE_BASE }}:${{ env.IMAGE_TAG }}
          docker push ${{ env.IMAGE_BASE_ECR }}:latest
          docker push ${{ env.IMAGE_BASE_ECR }}:${{ env.IMAGE_TAG }}