name: BankApp monorepo
on:
  push:
    branches: [ develop ]
  pull_request:
    branches: [ develop ]

env:
  GPR_REPO_URL: "https://maven.pkg.github.com/gromikkool/bank-app"

jobs:
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      individuals-service: ${{ steps.filter.outputs.individuals-service }}
      person-service: ${{ steps.filter.outputs.person-service }}
      transaction-service: ${{ steps.filter.outputs.transaction-service }}

    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            individuals-service:
              - 'individuals-api/**'
            person-service:
              - 'person-service/**'
            transaction-service:
              - 'transaction-service/**'

  build:
    needs: detect-changes
    runs-on: ubuntu-latest
    permissions:
      packages: write
      contents: read
    if: |
      needs.detect-changes.outputs.individuals-service == 'true' ||
      needs.detect-changes.outputs.person-service == 'true' ||
      needs.detect-changes.outputs.transaction-service == 'true'
    steps:
      - uses: actions/checkout@v4

      - name: Make all gradlew scripts executable
        run: find . -name "gradlew" -exec chmod +x {} +

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: 21
          distribution: 'corretto'
          cache: 'gradle'

      - name: Publish Person-service client
        if: needs.detect-changes.outputs.person-service == 'true'
        run: |
          cd person-service/person-service-client && ./gradlew publish \
          -PrepoUrl=${{ env.GPR_REPO_URL }} \
          -PgprUser=${{ secrets.GPR_USER }} \
          -PgprKey=${{ secrets.GITHUB_TOKEN }}

      - name: Publish Transaction-Service client
        if: needs.detect-changes.outputs.transaction-service == 'true'
        run: |
          cd transaction-service/transaction-service-client && ./gradlew publish \
          -PrepoUrl=${{ env.GPR_REPO_URL }} \
          -PgprUser=${{ secrets.GPR_USER }} \
          -PgprKey=${{ secrets.GITHUB_TOKEN }}



      - name: Build individuals-api
        if: needs.detect-changes.outputs.individuals-service == 'true'
        run: |
          cd individuals-api && ./gradlew build -x test \
          -PrepoUrl=${{ env.GPR_REPO_URL }} \
          -PgprUser=${{ secrets.GPR_USER }} \
          -PgprKey=${{ secrets.GITHUB_TOKEN }}

      - name: Build transaction-service
        if: needs.detect-changes.outputs.transaction-service == 'true'
        run: |
          cd transaction-service && ./gradlew build -x test \
            -PrepoUrl=${{ env.GPR_REPO_URL }} \
            -PgprUser=${{ secrets.GPR_USER }} \
            -PgprKey=${{ secrets.GITHUB_TOKEN }}

      - name: Build person-service
        if: needs.detect-changes.outputs.person-service == 'true'
        run: |
          cd person-service && ./gradlew build -x test \
            -PrepoUrl=${{ env.GPR_REPO_URL }} \
            -PgprUser=${{ secrets.GPR_USER }} \
            -PgprKey=${{ secrets.GITHUB_TOKEN }}

      - name: Upload JARs
        uses: actions/upload-artifact@v4
        with:
          name: compiled-jars
          path: |
            **/build/libs/*.jar
          retention-days: 1

  docker-create:
    needs: [detect-changes, build]
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      packages: write
      contents: read
    strategy:
      matrix:
        include:
          - service: individuals-api
            changed: ${{ needs.detect-changes.outputs.individuals-service }}
          - service: transaction-service
            changed: ${{ needs.detect-changes.outputs.transaction-service }}
          - service: person-service
            changed: ${{ needs.detect-changes.outputs.person-service }}
    if: matrix.changed == 'true'
    steps:
      - uses: actions/checkout@v4

      - name: Generate docker image tag
        run: echo "IMAGE_TAG=$GITHUB_SHA-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" >> $GITHUB_ENV

      # Create IMAGE_BASE variable
      - name: Set Image Context
        run: |
          echo "IMAGE_BASE=ghcr.io/${{ github.repository_owner }}/${{ matrix.service }}" >> $GITHUB_ENV

      - name: Log in to GitHub Container Registry
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Download JARs
        uses: actions/download-artifact@v4
        with:
          name: compiled-jars

      - name: Build docker image
        run: |
          docker build \
            -t ${{ env.IMAGE_BASE }}:latest \
            -t ${{ env.IMAGE_BASE }}:${{ env.IMAGE_TAG }} \
            ./${{ matrix.service }}

      - name: Run trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.IMAGE_BASE }}:${{ env.IMAGE_TAG }}
          format: 'table'
          exit-code: 1
          ignore-unfixed: true
          severity: CRITICAL

      - name: Push docker images
        run: |
          docker push ${{ env.IMAGE_BASE }}:latest
          docker push ${{ env.IMAGE_BASE }}:${{ env.IMAGE_TAG }}
