# support reading from .env file

spring:
  config:
    import: optional:file:.env[.properties]
  application:
    name: bank-app
  security:
    oauth2:
      client:
        registration:
          keycloak:
            provider: keycloak
            client-id: ${KEYCLOAK_CLIENT_ID}
            client-secret: ${KEYCLOAK_CLIENT_SECRET}
            client-name: ${KEYCLOAK_CLIENT_NAME}
            authorization-grant-type: authorization_code
            scope:
              - openid
              - profile
              - email
      resourceserver:
        jwt:
          issuer-uri: ${JWT_RESOURCE_SERVER_URL}
server:
  port: 8092

keycloak:
  auth-server-url: http://localhost:9091/
  realm: ${KEYCLOAK_REALM}
  admin-user: ${KEYCLOAK_ADMIN_USER}
  admin-password: ${KEYCLOAK_ADMIN_PASSWORD}

