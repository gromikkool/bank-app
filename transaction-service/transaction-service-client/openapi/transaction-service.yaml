openapi: 3.0.0
info:
  title: Transaction Service API
  version: 1.1.2

servers:
  - url: http://localhost:8082/api/v1

paths:
  /wallets:
    post:
      summary: Create a user wallet
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateWalletRequest'
      responses:
        '201':
          description: Wallet successfully created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WalletResponse'
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /wallets/{walletUid}:
    get:
      summary: Get wallet information
      parameters:
        - name: walletUid
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Wallet data
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WalletResponse'
        '404':
          description: Wallet not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /wallet-types:
    post:
      summary: Create a new wallet type
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateWalletTypeRequest'
      responses:
        '201':
          description: Wallet type successfully created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WalletTypeResponse'
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /wallet-types/{walletTypeUid}:
    get:
      summary: Get existing wallet type
      parameters:
        - name: walletTypeUid
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Wallet type data
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WalletTypeResponse'
        '404':
          description: Wallet type not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /transactions/{type}/init:
    post:
      summary: Initialize a transaction
      parameters:
        - name: type
          in: path
          required: true
          schema:
            type: string
            enum: [ DEPOSIT, WITHDRAWAL, TRANSFER ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TransactionInitRequest'
      responses:
        '200':
          description: Transaction terms
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TransactionInitResponse'
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /transactions/{type}/confirm:
    post:
      summary: Confirm and execute transaction
      parameters:
        - name: type
          in: path
          required: true
          schema:
            type: string
            enum: [ DEPOSIT, WITHDRAWAL, TRANSFER ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - $ref: '#/components/schemas/DepositConfirmRequest'
                - $ref: '#/components/schemas/WithdrawalConfirmRequest'
                - $ref: '#/components/schemas/TransferConfirmRequest'
      responses:
        '200':
          description: Transaction confirmed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TransactionConfirmResponse'
        '400':
          description: Confirmation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /transactions/{transactionId}/status:
    get:
      summary: Get transaction status
      parameters:
        - name: transactionId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Transaction status and details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TransactionStatusResponse'
        '404':
          description: Transaction not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

components:
  schemas:
    CreateWalletRequest:
      type: object
      required:
        - name
        - walletTypeUid
        - userUid
      properties:
        name:
          type: string
          maxLength: 32
        walletTypeUid:
          type: string
          format: uuid
        userUid:
          type: string
          format: uuid

    WalletResponse:
      type: object
      properties:
        uid:
          type: string
          format: uuid
        name:
          type: string
        walletTypeUid:
          type: string
          format: uuid
        userUid:
          type: string
          format: uuid
        status:
          type: string
        balance:
          type: number
          format: double
        createdAt:
          type: string
          format: date-time
        modifiedAt:
          type: string
          format: date-time
        archivedAt:
          type: string
          format: date-time

    CreateWalletTypeRequest:
      type: object
      required:
        - name
        - currencyCode
        - status
      properties:
        name:
          type: string
          maxLength: 32
        currencyCode:
          type: string
          maxLength: 3
        status:
          type: string
          maxLength: 18
        userType:
          type: string
          maxLength: 15
        creator:
          type: string
        modifier:
          type: string

    WalletTypeResponse:
      type: object
      properties:
        uuid:
          type: string
          format: uuid
        name:
          type: string
        currencyCode:
          type: string
        status:
          type: string
        archivedAt:
          type: string
          format: date-time
        userType:
          type: string
        creator:
          type: string
        modifier:
          type: string
        createdAt:
          type: string
          format: date-time
        modifiedAt:
          type: string
          format: date-time

    TransactionInitRequest:
      oneOf:
        - $ref: '#/components/schemas/DepositInitRequest'
        - $ref: '#/components/schemas/WithdrawalInitRequest'
        - $ref: '#/components/schemas/TransferInitRequest'
#      discriminator:
#        propertyName: type
#        mapping:
#          DEPOSIT: '#/components/schemas/DepositInitRequest'
#          WITHDRAWAL: '#/components/schemas/WithdrawalInitRequest'
#          TRANSFER: '#/components/schemas/TransferInitRequest'

    DepositInitRequest:
      allOf:
        - type: object
          required:
            - type
            - walletUid
            - amount
          properties:
            type:
              type: string
              default: DEPOSIT
              enum:
                - DEPOSIT
            walletUid:
              type: string
              format: uuid
            amount:
              type: number
              format: double
            comment:
              type: string
            fee:
              type: number
              format: double
            paymentMethodId:
              type: integer
            metadata:
              type: object
              additionalProperties:
                type: string

    WithdrawalInitRequest:
      allOf:
        - $ref: '#/components/schemas/DepositInitRequest'

    TransferInitRequest:
      type: object
      required:
        - type
        - fromWalletUid
        - toWalletUid
        - amount
      properties:
        type:
          type: string
          default: TRANSFER
          enum:
            - TRANSFER
        fromWalletUid:
          type: string
          format: uuid
        toWalletUid:
          type: string
          format: uuid
        amount:
          type: number
          format: double
        comment:
          type: string
        fee:
          type: number
          format: double
        metadata:
          type: object
          additionalProperties:
            type: string

    TransactionInitResponse:
      type: object
      properties:
        transactionId:
          type: string
          format: uuid
        expiresAt:
          type: string
          format: date-time

    DepositConfirmRequest:
      type: object
      required:
        - transactionId
      properties:
        transactionId:
          type: string
          format: uuid

    WithdrawalConfirmRequest:
      allOf:
        - $ref: '#/components/schemas/DepositConfirmRequest'

    TransferConfirmRequest:
      allOf:
        - $ref: '#/components/schemas/DepositConfirmRequest'

    TransactionConfirmResponse:
      type: object
      properties:
        transactionId:
          type: string
          format: uuid
        status:
          type: string
          enum: [ pending, completed, failed ]

    TransactionStatusResponse:
      type: object
      properties:
        transactionId:
          type: string
          format: uuid
        userUid:
          type: string
          format: uuid
        walletUid:
          type: string
          format: uuid
        targetWalletUid:
          type: string
          format: uuid
        type:
          type: string
          enum: [ DEPOSIT, WITHDRAWAL, TRANSFER ]
        status:
          type: string
        amount:
          type: number
          format: double
        fee:
          type: number
          format: double
        comment:
          type: string
        createdAt:
          type: string
          format: date-time
        modifiedAt:
          type: string
          format: date-time
        failureReason:
          type: string

    ErrorResponse:
      type: object
      properties:
        code:
          type: string
        message:
          type: string
        details:
          type: array
          items:
            type: string
